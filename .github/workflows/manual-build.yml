name: Manual Build

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Artifact to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-exe
          - windows-installer
          - linux-executable
          - linux-appimage
          - android-apk
          - ios
          - ios-unsigned-ipa
      upload_release:
        description: Upload built artifacts to GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

env:
  APP_NAME: csac
  FLUTTER_VERSION: "3.44.0"
  FLUTTER_LINUX_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.0-stable.tar.xz
  FLUTTER_WINDOWS_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.0-stable.zip

jobs:
  windows:
    name: Windows
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-exe' || github.event.inputs.artifact == 'windows-installer' }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install aria2
        run: choco install aria2 --no-progress -y

      - name: Download Flutter SDK
        shell: pwsh
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP "downloads"
          $sdkDir = Join-Path $env:RUNNER_TEMP "flutter-sdk"
          New-Item -ItemType Directory -Force -Path $downloadDir, $sdkDir | Out-Null

          aria2c -s16 -x16 -k1M `
            --dir="$downloadDir" `
            --out="flutter-windows.zip" `
            "${env:FLUTTER_WINDOWS_URL}"

          Expand-Archive `
            -Path (Join-Path $downloadDir "flutter-windows.zip") `
            -DestinationPath $sdkDir -Force

          $flutterBin = Join-Path $sdkDir "flutter\bin"
          $flutterRoot = Join-Path $sdkDir "flutter"

          $flutterBin | Out-File -FilePath $env:GITHUB_PATH -Append
          "FLUTTER_ROOT=$flutterRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: flutter --version
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: build/windows/x64/runner/Release

  linux:
    name: Linux
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'linux-executable' || github.event.inputs.artifact == 'linux-appimage' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 clang cmake libgtk-3-dev ninja-build pkg-config liblzma-dev libfuse2

      - name: Flutter SDK
        run: |
          mkdir -p $RUNNER_TEMP/flutter-sdk
          aria2c -x16 -s16 "$FLUTTER_LINUX_URL" -o flutter.tar.xz
          tar -xf flutter.tar.xz -C $RUNNER_TEMP/flutter-sdk
          echo "$RUNNER_TEMP/flutter-sdk/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter-sdk/flutter" >> $GITHUB_ENV

      - run: flutter --version
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux
          path: build/linux/x64/release/bundle

  android:
    name: Android
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'android-apk' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter SDK
        run: |
          mkdir -p $RUNNER_TEMP/flutter-sdk
          aria2c -x16 -s16 "$FLUTTER_LINUX_URL" -o flutter.tar.xz
          tar -xf flutter.tar.xz -C $RUNNER_TEMP/flutter-sdk
          echo "$RUNNER_TEMP/flutter-sdk/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter-sdk/flutter" >> $GITHUB_ENV

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS unsigned IPA
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'ios' || github.event.inputs.artifact == 'ios-unsigned-ipa' }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter --version
      - run: flutter pub get

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/

          cd build/ios/ipa
          zip -r ${{ env.APP_NAME }}-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ios
          path: build/ios/ipa/${{ env.APP_NAME }}-ios-unsigned.ipa

  release:
    name: Release
    if: ${{ always() && inputs.upload_release && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [windows, linux, android, ios]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: v
        run: |
          v=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "tag=v${v/+/-}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: release

      - run: |
          mkdir -p out
          cp -r release/* out/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          files: out/**/*