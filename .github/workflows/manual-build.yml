name: Manual Build

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Artifact to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-exe
          - windows-installer
          - linux-executable
          - linux-appimage
          - android-apk
          - ios
          - ios-unsigned-ipa

permissions:
  contents: read

env:
  APP_NAME: csac
  FLUTTER_VERSION: "3.44.0"
  FLUTTER_LINUX_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.0-stable.tar.xz
  FLUTTER_WINDOWS_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.0-stable.zip

jobs:

  windows:
    name: Windows
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-exe' || github.event.inputs.artifact == 'windows-installer' }}
    runs-on: windows-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - uses: actions/checkout@v4

      - name: Install aria2
        run: choco install aria2 --no-progress -y

      - name: Download Flutter SDK
        shell: pwsh
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP "downloads"
          $sdkDir = Join-Path $env:RUNNER_TEMP "flutter-sdk"

          New-Item -ItemType Directory -Force -Path $downloadDir, $sdkDir | Out-Null

          aria2c -s16 -x16 -k1M `
            --dir="$downloadDir" `
            --out="flutter-windows.zip" `
            "${env:FLUTTER_WINDOWS_URL}"

          Expand-Archive `
            -Path (Join-Path $downloadDir "flutter-windows.zip") `
            -DestinationPath $sdkDir -Force

          $flutterRoot = Join-Path $sdkDir "flutter"

          echo "$flutterRoot\bin" | Out-File $env:GITHUB_PATH -Append
          "FLUTTER_ROOT=$flutterRoot" | Out-File $env:GITHUB_ENV -Append

      - run: flutter --version
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package portable
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-exe' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/artifacts | Out-Null

          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath build/artifacts/${{ env.APP_NAME }}-windows-x64.zip

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-exe' }}
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: flutter/csac/build/artifacts/${{ env.APP_NAME }}-windows-x64.zip

  linux:
    name: Linux
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'linux-executable' || github.event.inputs.artifact == 'linux-appimage' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 clang cmake libfuse2 libgtk-3-dev liblzma-dev ninja-build pkg-config

      - name: Flutter SDK
        run: |
          mkdir -p "$RUNNER_TEMP/flutter-sdk"
          aria2c -o flutter.tar.xz "$FLUTTER_LINUX_URL"
          tar -xf flutter.tar.xz -C "$RUNNER_TEMP/flutter-sdk"

          echo "$RUNNER_TEMP/flutter-sdk/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter-sdk/flutter" >> $GITHUB_ENV

      - run: flutter --version
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: AppImage
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'linux-appimage' }}
        run: |
          mkdir -p build/artifacts

          appdir="build/appimage/${APP_NAME}.AppDir"
          rm -rf "$appdir"

          mkdir -p "$appdir/usr/bin"
          cp -a build/linux/x64/release/bundle/. "$appdir/usr/bin/"

          cat > "$appdir/AppRun" <<EOF
#!/usr/bin/env bash
set -e
DIR="\$(dirname "\$(readlink -f "\$0")")"
export LD_LIBRARY_PATH="\$DIR/usr/bin/lib"
exec "\$DIR/usr/bin/${APP_NAME}" "\$@"
EOF
          chmod +x "$appdir/AppRun"

          cat > "$appdir/${APP_NAME}.desktop" <<EOF
[Desktop Entry]
Type=Application
Name=CsAC
Exec=${APP_NAME}
Icon=${APP_NAME}
Categories=Network;
EOF

          cp "$appdir/${APP_NAME}.desktop" "$appdir/usr/share/applications/"

          appimagetool "$appdir" build/artifacts/${APP_NAME}.AppImage

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'linux-appimage' }}
        with:
          name: ${{ env.APP_NAME }}-linux-appimage
          path: flutter/csac/build/artifacts/*.AppImage

  android:
    name: Android
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'android-apk' }}
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup SDK path
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Flutter SDK
        run: |
          mkdir -p "$RUNNER_TEMP/flutter-sdk"
          aria2c -o flutter.tar.xz "$FLUTTER_LINUX_URL"
          tar -xf flutter.tar.xz -C "$RUNNER_TEMP/flutter-sdk"

          echo "$RUNNER_TEMP/flutter-sdk/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter-sdk/flutter" >> $GITHUB_ENV

      - run: flutter --version
      - run: flutter doctor -v
      - run: flutter pub get

      # ✅ FIXED SIGNING STEP
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -e

          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!v}" ]]; then
              echo "::error::$v missing"
              exit 1
            fi
          done

          mkdir -p android/app/signing

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/signing/release.jks

          if [[ ! -s android/app/signing/release.jks ]]; then
            echo "::error::keystore decode failed"
            exit 1
          fi

          cat > android/key.properties <<EOF
          storeFile=app/signing/release.jks
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

          echo "Checking keystore..."
          keytool -list \
            -keystore android/app/signing/release.jks \
            -storepass "$ANDROID_STORE_PASSWORD" >/dev/null

          echo "Checking alias..."
          keytool -list \
            -keystore android/app/signing/release.jks \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "Signing OK"

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-android-apk
          path: flutter/csac/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS unsigned IPA
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'ios' }}
    runs-on: macos-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload build/artifacts
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../artifacts/${APP_NAME}-ios.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ios-ipa
          path: flutter/csac/build/ios/artifacts/*.ipa