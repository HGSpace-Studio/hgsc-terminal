name: Manual Build

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Artifact to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-exe
          - windows-installer
          - linux-executable
          - linux-appimage
          - android-apk
          - ios
          - ios-unsigned-ipa

permissions:
  contents: read

env:
  APP_NAME: csac
  FLUTTER_VERSION: "3.44.0"
  FLUTTER_LINUX_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.0-stable.tar.xz
  FLUTTER_WINDOWS_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.0-stable.zip

jobs:

# ========================= WINDOWS =========================
  windows:
    name: Windows
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-exe' || github.event.inputs.artifact == 'windows-installer' }}
    runs-on: windows-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - uses: actions/checkout@v4

      - name: Install aria2
        run: choco install aria2 --no-progress -y

      - name: Setup Flutter
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP/flutter"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          aria2c -x16 -s16 -o flutter.zip "${env:FLUTTER_WINDOWS_URL}"
          Expand-Archive flutter.zip $dir -Force

          $flutterRoot = Join-Path $dir "flutter"
          "$flutterRoot\bin" | Out-File $env:GITHUB_PATH -Append
          "FLUTTER_ROOT=$flutterRoot" | Out-File $env:GITHUB_ENV -Append

      - run: flutter --version
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

# ========================= LINUX =========================
  linux:
    name: Linux
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'linux-executable' || github.event.inputs.artifact == 'linux-appimage' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 clang cmake libfuse2 libgtk-3-dev ninja-build pkg-config

      - name: Setup Flutter
        run: |
          mkdir -p $RUNNER_TEMP/flutter
          aria2c -o flutter.tar.xz $FLUTTER_LINUX_URL
          tar -xf flutter.tar.xz -C $RUNNER_TEMP/flutter

          echo "$RUNNER_TEMP/flutter/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter/flutter" >> $GITHUB_ENV

      - run: flutter --version
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

# ========================= ANDROID =========================
  android:
    name: Android
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'android-apk' }}
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Setup Flutter
        run: |
          mkdir -p $RUNNER_TEMP/flutter
          aria2c -o flutter.tar.xz $FLUTTER_LINUX_URL
          tar -xf flutter.tar.xz -C $RUNNER_TEMP/flutter

          echo "$RUNNER_TEMP/flutter/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter/flutter" >> $GITHUB_ENV

      - run: flutter --version
      - run: flutter doctor -v
      - run: flutter pub get

      # ================= SIGNING FIXED =================
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -e

          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v missing"
              exit 1
            fi
          done

          mkdir -p android/app/signing

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/signing/release.jks

          if [ ! -s android/app/signing/release.jks ]; then
            echo "::error::keystore decode failed"
            exit 1
          fi

          cat > android/key.properties <<EOF
storeFile=app/signing/release.jks
storePassword=$ANDROID_STORE_PASSWORD
keyAlias=$ANDROID_KEY_ALIAS
keyPassword=$ANDROID_KEY_PASSWORD
EOF

          echo "Checking keystore..."
          keytool -list -keystore android/app/signing/release.jks -storepass "$ANDROID_STORE_PASSWORD" >/dev/null

          echo "Checking alias..."
          keytool -list -keystore android/app/signing/release.jks -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "Signing OK"

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-android-apk
          path: flutter/csac/build/app/outputs/flutter-apk/app-release.apk

# ========================= IOS =========================
  ios:
    name: iOS unsigned IPA
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'ios' || github.event.inputs.artifact == 'ios-unsigned-ipa' }}
    runs-on: macos-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/artifacts
          cd build/ios/iphoneos

          mkdir -p Payload
          cp -R Runner.app Payload/

          zip -r ../../artifacts/${APP_NAME}-ios.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ios
          path: flutter/csac/build/artifacts/*.ipa