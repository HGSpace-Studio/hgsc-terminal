name: Manual Build

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Artifact to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-exe
          - windows-installer
          - linux-executable
          - linux-appimage
          - android-apk
          - ios
          - ios-unsigned-ipa

permissions:
  contents: read

env:
  APP_NAME: csac
  FLUTTER_VERSION: "3.44.0"
  FLUTTER_LINUX_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.0-stable.tar.xz
  FLUTTER_WINDOWS_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.0-stable.zip

jobs:
  windows:
    name: Windows
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-exe' || github.event.inputs.artifact == 'windows-installer' }}
    runs-on: windows-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install aria2
        run: choco install aria2 --no-progress -y

      - name: Download Flutter SDK
        shell: pwsh
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP "downloads"
          $sdkDir = Join-Path $env:RUNNER_TEMP "flutter-sdk"

          New-Item -ItemType Directory -Force -Path $downloadDir, $sdkDir | Out-Null

          aria2c -s16 -x16 -k1M `
            --dir="$downloadDir" `
            --out="flutter-windows.zip" `
            "${env:FLUTTER_WINDOWS_URL}"

          Expand-Archive `
            -Path (Join-Path $downloadDir "flutter-windows.zip") `
            -DestinationPath $sdkDir `
            -Force

          $flutterBin = Join-Path $sdkDir "flutter\bin"
          $flutterRoot = Join-Path $sdkDir "flutter"

          $flutterBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FLUTTER_ROOT=$flutterRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check Flutter
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows portable bundle
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-exe' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/artifacts | Out-Null

          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath build/artifacts/${{ env.APP_NAME }}-windows-x64.zip `
            -Force

      - name: Upload Windows portable bundle
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-exe' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: flutter/csac/build/artifacts/${{ env.APP_NAME }}-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'linux-executable' || github.event.inputs.artifact == 'linux-appimage' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 clang cmake libfuse2 libgtk-3-dev liblzma-dev ninja-build pkg-config

      - name: Download Flutter SDK
        run: |
          mkdir -p "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/flutter-sdk"

          aria2c -s16 -x16 -k1M \
            --dir="$RUNNER_TEMP/downloads" \
            --out="flutter-linux.tar.xz" \
            "$FLUTTER_LINUX_URL"

          tar -xf "$RUNNER_TEMP/downloads/flutter-linux.tar.xz" \
            -C "$RUNNER_TEMP/flutter-sdk"

          echo "$RUNNER_TEMP/flutter-sdk/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter-sdk/flutter" >> "$GITHUB_ENV"

      - name: Check Flutter
        run: flutter --version

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

  android:
    name: Android
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'android-apk' }}
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install Flutter SDK
        run: |
          mkdir -p "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/flutter-sdk"

          aria2c -s16 -x16 -k1M \
            --dir="$RUNNER_TEMP/downloads" \
            --out="flutter-linux.tar.xz" \
            "$FLUTTER_LINUX_URL"

          tar -xf "$RUNNER_TEMP/downloads/flutter-linux.tar.xz" \
            -C "$RUNNER_TEMP/flutter-sdk"

          echo "$RUNNER_TEMP/flutter-sdk/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter-sdk/flutter" >> "$GITHUB_ENV"

      - name: Check Flutter
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          missing=0

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name secret is required"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          mkdir -p android/app/signing

          clean_keystore_base64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | sed 's/^"//;s/"$//')"

          if [[ -z "$clean_keystore_base64" ]]; then
            echo "::error::keystore empty"
            exit 1
          fi

          printf '%s' "$clean_keystore_base64" | base64 --decode > android/app/signing/release.jks

          if [[ ! -s android/app/signing/release.jks ]]; then
            echo "::error::decoded keystore empty"
            exit 1
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-android-apk
          path: flutter/csac/build/app/outputs/flutter-apk/app-release.apk