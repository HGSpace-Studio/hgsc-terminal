name: Manual Build

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Artifact to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-exe
          - windows-installer
          - linux-executable
          - linux-appimage
          - android-apk
          - ios
          - ios-unsigned-ipa

permissions:
  contents: read

env:
  APP_NAME: csac
  FLUTTER_VERSION: "3.44.0"
  FLUTTER_LINUX_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.0-stable.tar.xz
  FLUTTER_WINDOWS_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.0-stable.zip

jobs:

  windows:
    name: Windows
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-exe' || github.event.inputs.artifact == 'windows-installer' }}
    runs-on: windows-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - uses: actions/checkout@v4

      - name: Install aria2
        run: choco install aria2 --no-progress -y

      - name: Download Flutter SDK
        shell: pwsh
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP "downloads"
          $sdkDir = Join-Path $env:RUNNER_TEMP "flutter-sdk"

          New-Item -ItemType Directory -Force -Path $downloadDir, $sdkDir | Out-Null

          aria2c -s16 -x16 -k1M `
            --dir="$downloadDir" `
            --out="flutter.zip" `
            "${env:FLUTTER_WINDOWS_URL}"

          Expand-Archive `
            -Path (Join-Path $downloadDir "flutter.zip") `
            -DestinationPath $sdkDir -Force

          $flutterBin = Join-Path $sdkDir "flutter\bin"
          $flutterRoot = Join-Path $sdkDir "flutter"

          $flutterBin | Out-File $env:GITHUB_PATH -Append
          "FLUTTER_ROOT=$flutterRoot" | Out-File $env:GITHUB_ENV -Append

      - run: flutter --version
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package
        if: ${{ contains(github.event.inputs.artifact, 'windows') }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/artifacts | Out-Null
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath build/artifacts/${{ env.APP_NAME }}-windows.zip

      - uses: actions/upload-artifact@v4
        if: ${{ contains(github.event.inputs.artifact, 'windows') }}
        with:
          name: ${{ env.APP_NAME }}-windows
          path: flutter/csac/build/artifacts/*.zip


  linux:
    name: Linux
    if: ${{ contains(github.event.inputs.artifact, 'linux') || github.event.inputs.artifact == 'all' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 clang cmake libgtk-3-dev ninja-build pkg-config

      - name: Download Flutter
        run: |
          mkdir -p $RUNNER_TEMP/flutter-sdk
          aria2c -x16 "$FLUTTER_LINUX_URL" -o flutter.tar.xz
          tar -xf flutter.tar.xz -C $RUNNER_TEMP/flutter-sdk

          echo "$RUNNER_TEMP/flutter-sdk/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter-sdk/flutter" >> $GITHUB_ENV

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build linux --release


  android:
    name: Android
    if: ${{ contains(github.event.inputs.artifact, 'android') || github.event.inputs.artifact == 'all' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -e

          mkdir -p android/app/signing

          clean=$(echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r\t ')

          echo "$clean" | base64 -d > android/app/signing/release.jks

          cat > android/key.properties <<EOF
storeFile=app/signing/release.jks
storePassword=$ANDROID_STORE_PASSWORD
keyAlias=$ANDROID_KEY_ALIAS
keyPassword=$ANDROID_KEY_PASSWORD
EOF

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-android
          path: flutter/csac/build/app/outputs/flutter-apk/app-release.apk


  ios:
    name: iOS unsigned IPA
    if: ${{ contains(github.event.inputs.artifact, 'ios') || github.event.inputs.artifact == 'all' }}
    runs-on: macos-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Package IPA
        shell: bash
        run: |
          set -e

          mkdir -p build/ios/ipa/Payload
          mkdir -p build/artifacts

          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app

          cd build/ios/ipa
          zip -r ../artifacts/${APP_NAME}-ios.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ios
          path: flutter/csac/build/artifacts/*.ipa