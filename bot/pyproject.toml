[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csacbot"
version = "0.1.0"
description = "Python bot framework for CsAC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CsAC" }]
dependencies = [
  "requests>=2.31.0",
  "pycryptodome>=3.20.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
