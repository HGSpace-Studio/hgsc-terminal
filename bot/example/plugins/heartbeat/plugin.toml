name = "heartbeat"
version = "0.2.0"
author = "CsAC Team"
description = "按固定间隔向监听群发送心跳消息。"
entry = "main.py"
permissions = ["send_message", "storage"]

[[config]]
key = "interval"
type = "number"
default = 60
description = "心跳任务间隔秒数"

[[config]]
key = "text"
type = "string"
default = "heartbeat"
description = "心跳消息前缀"
